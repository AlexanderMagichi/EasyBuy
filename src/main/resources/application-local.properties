# Профиль для локальной разработки без внешних зависимостей
server.port=8080

# Локальные базы
spring.datasource.url=jdbc:postgresql://localhost:5432/easybuy
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ПОЧТА ОТКЛЮЧЕНА (Чтобы регистрация работала без интернета и ошибок)
email.enabled=false

# Расширенные логи для разработки
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.teamchallenge.easybuy=DEBUG

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=pre-flyway schema (hibernate ddl-auto)