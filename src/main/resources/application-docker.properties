# Профиль для Oracle Cloud / Docker
server.port=${PORT:8080}

# Имена сервисов в docker-network
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/easybuy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Включаем почту на сервере
email.enabled=${EMAIL_ENABLED:true}

spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=pre-flyway schema (hibernate ddl-auto)