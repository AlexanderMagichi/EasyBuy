openapi: 3.0.1
info:
  title: EasyBuy API
  description: EasyBuy API documentation
  version: 1.0.0
servers:
  - url: https
tags:
  - name: FavoriteProducts
    description: Favorite Products API
paths:
  /health:
    get:
      operationId: healthGET
      responses:
        '200':
          description: OK

  # Эндпоинты авторизации
  /api/v1/auth/register:
    post:
      tags: [Security]
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '200': {description: OK}

  /api/v1/auth/authenticate:
    post:
      tags: [Security]
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthenticationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthenticationResponse'

  # Эндпоинты адресов
  /customers/addresses:
    get:
      tags: [DeliveryAddress]
      operationId: getAllAddresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryAddressDto'
    post:
      tags: [DeliveryAddress]
      operationId: createAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAddressDto'

  # Эндпоинты избранного
  /api/v1/favorites:
    get:
      tags: [FavoriteProducts]
      operationId: getListOfFavoriteProducts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfFavoriteProductsDto'
    post:
      tags: [FavoriteProducts]
      operationId: addListOfFavoriteProducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListOfFavoriteProducts'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfFavoriteProductsDto'

  /api/v1/favorites/{productId}:
    delete:
      tags: [FavoriteProducts]
      operationId: removeProductFromFavorite
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - CREATED
        - PROCESSING
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - RETURNED

    OrderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        # Вы можете добавить сюда другие нужные поля, например: totalAmount, items и т.д.

    AddressDto:
      type: object
      properties:
        city:
          type: string
        street:
          type: string

    DeliveryAddressDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        line:
          type: string
        city:
          type: string
        country:
          type: string
        postcode:
          type: string
        isDefault:
          type: boolean

    DeliveryAddressRequest:
      type: object
      properties:
        label:
          type: string
        line:
          type: string
        city:
          type: string
        country:
          type: string
        postcode:
          type: string

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/AddressDto'
        avatarLink:
          type: string

    UserRegistrationRequest:
      type: object
      required:
        - role
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          pattern: CUSTOMER|SELLER
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'

    UserAuthenticationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserAuthenticationResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string

    UpdateUserAccountRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/AddressDto'

    ChangeUserPasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    ConfirmEmailRequest:
      type: object
      properties:
        token:
          type: string
        code:
          type: string

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email

    ConfirmPasswordResetRequest:
      type: object
      properties:
        token:
          type: string

    InitiatePasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
    CreateNewOrderRequestDto:
      type: object
      required:
        - address
        - recipientName
        - recipientSurname
      properties:
        address:
          $ref: '#/components/schemas/DeliveryAddressRequest'
        recipientName:
          type: string
        recipientSurname:
          type: string
        recipientPhone:
          type: string

    # --- Favorites ---
    ListOfFavoriteProducts:
      type: object
      required:
        - goods
      properties:
        goods:
          type: array
          items:
            type: string
            format: uuid

    FavoriteListDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        favoriteItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              productId:
                type: string
                format: uuid

    ListOfFavoriteProductsDto:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/GoodsDTO'

    GoodsDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        art:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        mainImageUrl:
          type: string
        stock:
          type: integer
        reviewsCount:
          type: integer
        shopId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        rating:
          type: integer
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time