spring.application.name=EasyBuy
server.port=${PORT:8080}

# Database Base Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/easybuy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Redis Base Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.cache-names=categories,categoryIds
temporary-cache.time.token=15

# JWT Configuration (Секреты берутся из ENV, с фолбеком для локальной разработки)
jwt.header=Authorization
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.refresh-secret=${JWT_REFRESH_SECRET:6150645367566B5970404E635266556A586E3272357538782F413F4428472B4B}
jwt.expiration=15m
jwt.refresh-expiration=7d
jwt.issuer=easybuy
jwt.audience=easybuy-users

# Mail Configuration (Все чувствительные данные в переменные)
email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.subject.confirmation=EasyBuy Registration Confirmation
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUD_NAME:easybuymarketplace}
cloudinary.api-key=${CLOUD_KEY:}
cloudinary.api-secret=${CLOUD_SECRET:}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}
stripe.onboarding.return-url=${STRIPE_ONBOARDING_RETURN_URL:http://localhost:8080/billing/return}
stripe.onboarding.refresh-url=${STRIPE_ONBOARDING_REFRESH_URL:http://localhost:8080/billing/refresh}

# Frontend URL
frontend.server.url=${FRONTEND_URL:https://marketplace-easybuy-project.vercel.app}

# Security & Swagger
login-attempts.max-attempts=5
login-attempts.lockout-duration-minutes=30
spring.cloud.vault.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.springframework.security=ERROR
logging.level.com.teamchallenge.easybuy=INFO
logging.level.org.springframework.boot=INFO
logging.level.root=INFO